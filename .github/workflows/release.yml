name: Release

# A tag v<version> releases everything at once (docs/decisions/0010-release-pipeline.md):
#   app        GitHub release with ForeverTV-<rid>.zip and signed update.json (the in-app updater and
#              apps.tomlabs.cz read it from there)
#   addon      ForeverTV-<version>.zip attached to the release and uploaded to CurseForge
#   extension  ForeverTV-extension-<version>.zip attached to the release and submitted to the Chrome Web Store
#
# Secrets: UPDATE_SIGNING_KEY, CURSEFORGE_API_TOKEN, CWS_CLIENT_ID, CWS_CLIENT_SECRET, CWS_REFRESH_TOKEN.
# Variables: CWS_PUBLISHER_ID, CWS_EXTENSION_ID. A store whose settings are missing is skipped with a warning.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tag, version and changelog agree
        shell: pwsh
        run: |
          Import-Module ./tools/Release.psm1
          $version = Get-ReleaseVersion
          if ('${{ github.ref_name }}' -ne "v$version") { throw "Tag ${{ github.ref_name }} does not match VersionPrefix $version." }
          Get-ChangelogSection $version | Out-Null
      - run: dotnet test ForeverTV.slnx -c Release
      - run: node --test extension/test/extension.test.mjs

  app:
    needs: verify
    uses: TomasBouda/TomLabs.AutoUpdate/.github/workflows/publish-app.yml@master
    with:
      project: src/ForeverTV.App/ForeverTV.App.csproj
      app-name: ForeverTV
      channel: stable
      submodules: false
    secrets:
      signing-key: ${{ secrets.UPDATE_SIGNING_KEY }}

  stores:
    needs: app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach addon and extension to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./tools/Build-Addon.ps1
          ./tools/Build-Extension.ps1
          gh release upload '${{ github.ref_name }}' artifacts/*.zip --clobber
      - name: CurseForge
        shell: pwsh
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
        run: ./tools/Publish-CurseForge.ps1
      - name: Chrome Web Store
        shell: pwsh
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
        run: ./tools/Publish-ChromeWebStore.ps1
